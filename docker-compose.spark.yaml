name: q4-spark

services:
  spark-master:
    image: spark:4.2.0-scala2.13-java17-python3-ubuntu
    hostname: spark-master
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master
      - --host
      - spark-master
      - --port
      - "7077"
      - --webui-port
      - "8080"
    ports:
      - "7077:7077"
      - "8081:8080"
    volumes:
      - ./jobs:/opt/spark/jobs:ro
      - ./data:/opt/spark/data:ro
    networks:
      - spark-network

  spark-worker:
    image: spark:4.2.0-scala2.13-java17-python3-ubuntu
    hostname: spark-worker
    depends_on:
      - spark-master
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - --webui-port
      - "8081"
      - --cores
      - "1"
      - --memory
      - "1g"
      - spark://spark-master:7077
    ports:
      - "8082:8081"
    volumes:
      - ./jobs:/opt/spark/jobs:ro
      - ./data:/opt/spark/data:ro
    networks:
      - spark-network

networks:
  spark-network:
    driver: bridge